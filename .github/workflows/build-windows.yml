name: Build Mosaic for Windows

# Every push builds Mosaic (VST3 + standalone) and an installer on GitHub's Windows machines and, on main,
# publishes them as a Release anyone can download without signing in:
#   https://github.com/stefanoPollina/MOSAIC_PLUGIN/releases/latest
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE and the WebView2 SDK)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Mosaic
        run: cmake --build build --config Release --target MOSAIC_VST3 MOSAIC_Standalone --parallel

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(MOSAIC VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v.$env:GITHUB_RUN_NUMBER" installer\mosaic.iss

      - name: Collect the downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer\Output\*.exe dist\
          Copy-Item build\MOSAIC_artefacts\Release\Standalone\Mosaic.exe dist\
          Copy-Item -Recurse "build\MOSAIC_artefacts\Release\VST3\Mosaic.vst3" dist\
          Get-ChildItem dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mosaic-windows
          path: dist/

      - name: Publish a Release (direct, public download links)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(MOSAIC VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $ver = "$v.$env:GITHUB_RUN_NUMBER"
          New-Item -ItemType Directory -Force rel | Out-Null
          Copy-Item (Get-ChildItem installer\Output\*.exe | Select-Object -First 1).FullName rel\Mosaic-Windows-Setup.exe
          Compress-Archive -Path dist\Mosaic.exe, dist\Mosaic.vst3, docs\Mosaic-Manual.pdf -DestinationPath rel\Mosaic-Windows-Plugins.zip
          $notes = "Mosaic $ver for Windows.`n`n- **Mosaic-Windows-Setup.exe**: the installer (VST3 + standalone). Close your DAW first, then rescan plugins.`n- **Mosaic-Windows-Plugins.zip**: the same files to copy by hand (the VST3 goes in C:\Program Files\Common Files\VST3), plus **Mosaic-Manual.pdf**, the instruction manual.`n`nBuilt from $env:GITHUB_SHA."
          gh release create "v$ver" rel\Mosaic-Windows-Setup.exe rel\Mosaic-Windows-Plugins.zip --title "Mosaic $ver" --notes $notes --latest --target $env:GITHUB_SHA

      # ---- Mosaic FX (the effect plugin). Runs after Mosaic's own release and may fail without affecting it:
      # it builds its own target, installer (installer/OutputFX) and download, and never replaces a Mosaic file.
      - name: Build Mosaic FX
        id: fxbuild
        continue-on-error: true
        run: cmake --build build --config Release --target MOSAIC_FX_VST3 --parallel

      - name: Build Mosaic FX installer
        id: fxinst
        if: steps.fxbuild.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(MOSAIC VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v.$env:GITHUB_RUN_NUMBER" installer\mosaic-fx.iss
          New-Item -ItemType Directory -Force distfx | Out-Null
          Copy-Item (Get-ChildItem installer\OutputFX\*.exe | Select-Object -First 1).FullName distfx\Mosaic-FX-Windows-Setup.exe
          Copy-Item -Recurse "build\MOSAIC_FX_artefacts\Release\VST3\Mosaic FX Suite.vst3" distfx\
          Compress-Archive -Path "distfx\Mosaic FX Suite.vst3" -DestinationPath distfx\Mosaic-FX-Windows-Plugins.zip
          Get-ChildItem distfx

      - name: Upload Mosaic FX
        if: steps.fxinst.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Mosaic-FX-windows
          path: distfx/

      - name: Add Mosaic FX to the Release
        if: github.ref == 'refs/heads/main' && steps.fxinst.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(MOSAIC VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          gh release upload "v$v.$env:GITHUB_RUN_NUMBER" distfx\Mosaic-FX-Windows-Setup.exe distfx\Mosaic-FX-Windows-Plugins.zip


  # ---- the Mac build: Mosaic and Mosaic FX Suite as VST3 + Audio Unit (+ Mosaic's standalone app), Apple Silicon and
  # Intel in one. Its own job: a Mac problem never holds up the Windows release, and on main it adds two zips to it.
  macos:
    runs-on: macos-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE)
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build Mosaic
        run: cmake --build build --config Release --target MOSAIC_VST3 MOSAIC_AU MOSAIC_Standalone -- -quiet

      - name: Build Mosaic FX Suite
        id: fxmac
        continue-on-error: true
        run: cmake --build build --config Release --target MOSAIC_FX_VST3 MOSAIC_FX_AU -- -quiet

      - name: Check (both chips, and Apple's Audio Unit validator)
        continue-on-error: true
        run: |
          lipo -archs build/MOSAIC_artefacts/Release/VST3/Mosaic.vst3/Contents/MacOS/Mosaic
          mkdir -p ~/Library/Audio/Plug-Ins/Components && cp -R build/MOSAIC_artefacts/Release/AU/Mosaic.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true; sleep 2
          auval -v aumu Msc1 Cntm | tail -25

      - name: Package
        run: |
          A=build/MOSAIC_artefacts/Release
          mkdir -p "dist/Mosaic (macOS)"
          cp -R "$A/VST3/Mosaic.vst3" "$A/AU/Mosaic.component" "$A/Standalone/Mosaic.app" "dist/Mosaic (macOS)/"
          cp installer/INSTALL-MAC.txt docs/Mosaic-Manual.pdf "dist/Mosaic (macOS)/"
          for b in "dist/Mosaic (macOS)"/*.vst3 "dist/Mosaic (macOS)"/*.component "dist/Mosaic (macOS)"/*.app; do codesign --force --deep --sign - "$b"; done
          (cd dist && ditto -c -k --keepParent "Mosaic (macOS)" Mosaic-macOS.zip)
          if [ "${{ steps.fxmac.outcome }}" = "success" ]; then
            F=build/MOSAIC_FX_artefacts/Release
            mkdir -p "dist/Mosaic FX Suite (macOS)"
            cp -R "$F/VST3/Mosaic FX Suite.vst3" "$F/AU/Mosaic FX Suite.component" "dist/Mosaic FX Suite (macOS)/"
            cp installer/INSTALL-MAC-FX.txt "dist/Mosaic FX Suite (macOS)/"
            for b in "dist/Mosaic FX Suite (macOS)"/*.vst3 "dist/Mosaic FX Suite (macOS)"/*.component; do codesign --force --deep --sign - "$b"; done
            (cd dist && ditto -c -k --keepParent "Mosaic FX Suite (macOS)" Mosaic-FX-macOS.zip)
          fi
          ls -la dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mosaic-macos
          path: dist/*.zip

      - name: Add the Mac downloads to the Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^project(MOSAIC VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          gh release upload "v$v.$GITHUB_RUN_NUMBER" dist/*.zip
